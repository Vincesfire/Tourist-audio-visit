<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 Guide Audio Touristique</title>
    
    <!-- Configuration pour l'écran d'accueil du smartphone (PWA & iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Guide Audio">
    <link rel="apple-touch-icon" href="https://images.emojiterra.com/google/android-11/512px/1f30f.png">

      "name": "Guide Audio Touristique",
      "short_name": "Guide Audio",

      "theme_color": "#0b132b",
      "icons": [
        {
          "src": "https://images.emojiterra.com/google/android-11/512px/1f30f.png",
          "sizes": "512x512",
          "type": "image/png"

      ]
    }'>

    <!-- Leaflet CSS & JS pour la cartographie -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b132b;
            color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }
        .card {
            background: #1c2541;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid #3a506b;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.35rem;
            margin: 8px 0 14px 0;
            color: #ffffff;
        }
        button {
            background-color: #ffd166;
            color: #0b132b;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 28px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(255, 209, 102, 0.2);
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #3a506b;
            color: #8d99ae;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* Conteneur de la Carte affiché immédiatement */
        #map-container {
            width: 100%;
            margin: 12px 0;
            display: block;
            position: relative;
        }
        #map {
            width: 100%;
            height: 260px;
            border-radius: 12px;
            border: 1px solid #3a506b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        /* Ligne de boutons GPS et Recherche de lieux sur la même ligne */
        .gps-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .gps-row button {
            margin-bottom: 0;
            font-size: 0.9rem;
            padding: 12px 10px;
        }
        #search-tourist-btn {
            background-color: #06d6a0;
            color: #0b132b;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 12px 0;
            color: #8d99ae;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #3a506b;
        }
        .divider span {
            padding: 0 8px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 24px;
            border: 1px solid #3a506b;
            background-color: #0b132b;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            -webkit-appearance: none;
        }
        .search-box input:focus {
            border-color: #ffd166;
        }
        .search-box button {
            width: 50px;
            flex-shrink: 0;
            margin-bottom: 0;
            padding: 0;
            border-radius: 24px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .more-btn {
            background-color: #28385e;
            color: #ffd166;
            border: 1px solid #ffd166;
            margin-top: 10px;
            margin-bottom: 10px;
            display: none;
        }
        
        /* Paramètres alignés sur une seule ligne */
        .config-row {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }
        .config-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            background: #0b132b;
            padding: 6px 8px;
            border-radius: 12px;
            border: 1px solid #3a506b;
            text-align: center;
        }
        .config-item label {
            font-size: 0.7rem;
            color: #8d99ae;
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .config-item select {
            width: 100%;
            padding: 6px 4px;
            border-radius: 8px;
            border: 1px solid #3a506b;
            background: #1c2541;
            color: #ffffff;
            font-size: 0.8rem;
            outline: none;
            text-align: center;
        }

        #status {
            margin: 10px 0;
            font-size: 0.85rem;
            color: #ffd166;
            min-height: 20px;
            padding: 0 4px;
            word-break: break-word;
        }
        #progress-container {
            margin: 12px 0 4px 0;
            display: none;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #0b132b;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #3a506b;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #ffd166;
            transition: width 0.2s linear;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #8d99ae;
            margin-top: 4px;
        }
        
        #carousel-container {
            margin: 12px 0;
            display: none;
            position: relative;
        }
        .carousel-wrapper {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #3a506b;
            background: #0b132b;
        }
        .carousel-track-container {
            width: 100%;
            max-height: 200px;
            overflow: hidden;
            display: flex;
        }
        .carousel-track {
            display: flex;
            width: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .carousel-slide {
            min-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b132b;
        }
        .carousel-slide img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
        }
        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }
        .indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #3a506b;
            cursor: pointer;
        }
        .indicator.active {
            background-color: #ffd166;
        }

        #article-title {
            font-weight: bold;
            font-size: 1.05rem;
            margin: 8px 0 4px 0;
            color: #ffd166;
            word-break: break-word;
        }
        #sources-badge {
            font-size: 0.75rem;
            color: #8d99ae;
            margin-bottom: 8px;
        }
        
        /* Zone de texte sans scroll, s'adapte automatiquement à la hauteur du texte complet */
        #output {
            text-align: left;
            background: #0b132b;
            padding: 12px;
            border-radius: 10px;
