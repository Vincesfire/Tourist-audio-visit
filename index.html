<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 Guide Audio Touristique</title>
    
    <!-- Configuration pour l'écran d'accueil du smartphone (PWA & iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Guide Audio">
    <link rel="apple-touch-icon" href="https://images.emojiterra.com/google/android-11/512px/1f30f.png">
    
    <!-- Manifest inline avec l'icône du globe terrestre -->
    <link rel="manifest" href='data:application/manifest+json,{
      "name": "Guide Audio Touristique",
      "short_name": "Guide Audio",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#0b132b",
      "theme_color": "#0b132b",
      "icons": [
        {
          "src": "https://images.emojiterra.com/google/android-11/512px/1f30f.png",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    }'>

    <!-- Leaflet CSS & JS pour la cartographie -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b132b;
            color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }
        .card {
            background: #1c2541;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid #3a506b;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.35rem;
            margin: 8px 0 14px 0;
            color: #ffffff;
        }
        button {
            background-color: #ffd166;
            color: #0b132b;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 28px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(255, 209, 102, 0.2);
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #3a506b;
            color: #8d99ae;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* Conteneur de la Carte */
        #map-container {
            width: 100%;
            margin: 12px 0;
            display: none;
        }
        #map {
            width: 100%;
            height: 280px;
            border-radius: 12px;
            border: 1px solid #3a506b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 12px 0;
            color: #8d99ae;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #3a506b;
        }
        .divider span {
            padding: 0 8px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 24px;
            border: 1px solid #3a506b;
            background-color: #0b132b;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            -webkit-appearance: none;
        }
        .search-box input:focus {
            border-color: #ffd166;
        }
        .search-box button {
            width: 50px;
            flex-shrink: 0;
            margin-bottom: 0;
            padding: 0;
            border-radius: 24px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .secondary-btn {
            background-color: #28385e;
            color: #f0f2f5;
            padding: 12px;
            font-size: 0.9rem;
            border: 1px solid #3a506b;
        }
        .more-btn {
            background-color: #28385e;
            color: #ffd166;
            border: 1px solid #ffd166;
            margin-top: 10px;
            margin-bottom: 10px;
            display: none;
        }
        .config-control {
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #b0c4de;
            background: #0b132b;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #3a506b;
        }
        .config-control select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #3a506b;
            background: #1c2541;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }
        #status {
            margin: 10px 0;
            font-size: 0.85rem;
            color: #ffd166;
            min-height: 20px;
            padding: 0 4px;
            word-break: break-word;
        }
        #progress-container {
            margin: 12px 0 4px 0;
            display: none;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #0b132b;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #3a506b;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #ffd166;
            transition: width 0.2s linear;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #8d99ae;
            margin-top: 4px;
        }
        
        #carousel-container {
            margin: 12px 0;
            display: none;
            position: relative;
        }
        .carousel-wrapper {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #3a506b;
            background: #0b132b;
        }
        .carousel-track-container {
            width: 100%;
            max-height: 200px;
            overflow: hidden;
            display: flex;
        }
        .carousel-track {
            display: flex;
            width: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .carousel-slide {
            min-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b132b;
        }
        .carousel-slide img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
        }
        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }
        .indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #3a506b;
            cursor: pointer;
        }
        .indicator.active {
            background-color: #ffd166;
        }

        #article-title {
            font-weight: bold;
            font-size: 1.05rem;
            margin: 8px 0 4px 0;
            color: #ffd166;
            word-break: break-word;
        }
        #sources-badge {
            font-size: 0.75rem;
            color: #8d99ae;
            margin-bottom: 8px;
        }
        #output {
            text-align: left;
            background: #0b132b;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 8px;
            display: none;
            color: #e2e8f0;
            border: 1px solid #3a506b;
            -webkit-overflow-scrolling: touch;
        }
        #wikipedia-link-container {
            margin-top: 14px;
            display: none;
            font-size: 0.85rem;
        }
        #wikipedia-link-container a {
            color: #ffd166;
            text-decoration: none;
            font-weight: 500;
            word-break: break-word;
        }
        #wikipedia-link-container a:hover {
            text-decoration: underline;
        }

        .app-version {
            text-align: center;
            font-size: 0.75rem;
            color: #8d99ae;
            margin-top: 16px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🌍 Guide Audio Touristique</h1>
    
    <button id="listen-btn" onclick="startGuideGPS()">📍 Écouter le lieu actuel (GPS)</button>

    <!-- Zone de carte Leaflet -->
    <div id="map-container">
        <div id="map"></div>
    </div>
    
    <div class="divider"><span>OU SAISIR UN LIEU</span></div>

    <div class="search-box">
        <input type="text" id="manual-place-input" placeholder="Ex: Big Ben, Tour Eiffel..." onkeypress="handleKeyPress(event)">
        <button id="search-btn" onclick="startGuideManual()">🔍</button>
    </div>

    <div class="config-control">
        <label for="duration-select">Durée de l'explication :</label>
        <select id="duration-select">
            <option value="1">1 minute</option>
            <option value="2" selected>2 minutes</option>
            <option value="4">4 minutes</option>
            <option value="6">6 minutes</option>
        </select>
    </div>

    <div class="config-control">
        <label for="speed-select">Vitesse de lecture :</label>
        <select id="speed-select" onchange="changeSpeed()">
            <option value="0.75">0.75x (Lent)</option>
            <option value="1.0">1.0x (Normal)</option>
            <option value="1.1" selected>1.1x (Idéal)</option>
            <option value="1.25">1.25x (Rapide)</option>
            <option value="1.5">1.5x (Très rapide)</option>
            <option value="2.0">2.0x (Max)</option>
        </select>
    </div>

    <div class="controls">
        <button id="pause-btn" class="secondary-btn" onclick="togglePause()" disabled>Pause</button>
        <button id="stop-btn" class="secondary-btn" onclick="stopAudio()" disabled>Arrêter</button>
    </div>

    <div id="progress-container">
        <div class="progress-bar-bg">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <div class="time-info">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
        </div>
    </div>

    <button id="more-btn" class="more-btn" onclick="loadMoreDetails()">📖 En savoir plus (+ de chapitres)</button>

    <div id="status">Choisissez une méthode pour démarrer.</div>
    
    <div id="carousel-container">
        <div class="carousel-wrapper">
            <div class="carousel-track-container">
                <div id="carousel-track" class="carousel-track"></div>
            </div>
        </div>
        <div id="carousel-indicators" class="carousel-indicators"></div>
    </div>
    
    <div id="article-title"></div>
    <div id="sources-badge"></div>

    <div id="output"></div>

    <div id="wikipedia-link-container">
        <a id="wikipedia-link" href="#" target="_blank">📖 Lire l'article complet sur Wikipédia</a>
    </div>

    <div class="app-version">2026.11.8.3</div>
</div>

<script>
    const synth = window.speechSynthesis;
    let currentUtterance = null;
    let combinedContent = [];
    let currentChunkIndex = 0;
    let currentTitle = "";
    let availableVoices = [];

    let speechStartTime = 0;
    let speechDurationMs = 0;
    let progressInterval = null;
    let isPausedState = false;
    let pauseElapsedMs = 0;
    let currentSpokenText = "";

    let carouselImages = [];
    let currentSlideIndex = 0;

    // Variables pour Leaflet
    let map = null;
    let userMarker = null;
    let poiLayerGroup = null;
    let radiusCircle = null;

    function loadVoices() {
        availableVoices = synth.getVoices();
    }
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    function getBestFrenchVoice() {
        if (availableVoices.length === 0) {
            availableVoices = synth.getVoices();
        }
        const frVoices = availableVoices.filter(v => v.lang.startsWith('fr'));
        if (frVoices.length === 0) return null;

        const premiumVoice = frVoices.find(v => 
            v.name.includes('Google') || 
            v.name.includes('Natural') || 
            v.name.includes('Premium') || 
            v.name.includes('Enhanced') ||
            v.name.includes('Améliorée')
        );
        return premiumVoice || frVoices[0];
    }

    function setStatus(text) {
        document.getElementById('status').innerText = text;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function resetUI() {
        stopAudio();
        document.getElementById('output').style.display = 'none';
        document.getElementById('article-title').innerText = '';
        document.getElementById('sources-badge').innerText = '';
        document.getElementById('carousel-container').style.display = 'none';
        document.getElementById('carousel-track').innerHTML = '';
        document.getElementById('carousel-indicators').innerHTML = '';
        document.getElementById('wikipedia-link-container').style.display = 'none';
        document.getElementById('more-btn').style.display = 'none';
        document.getElementById('progress-container').style.display = 'none';
        combinedContent = [];
        currentChunkIndex = 0;
        carouselImages = [];
        currentSlideIndex = 0;
        currentSpokenText = "";
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            startGuideManual();
            document.getElementById('manual-place-input').blur();
        }
    }

    function initOrUpdateMap(lat, lon) {
        const mapContainer = document.getElementById('map-container');
        mapContainer.style.display = 'block';

        const radiusMeters = 300; // Rayon ajusté à 300 mètres

        if (!map) {
            map = L.map('map').setView([lat, lon], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            poiLayerGroup = L.layerGroup().addTo(map);
        } else {
            map.setView([lat, lon], 15);
            poiLayerGroup.clearLayers();
            if (userMarker) map.removeLayer(userMarker);
            if (radiusCircle) map.removeLayer(radiusCircle);
        }

        // Marqueur bleu pour l'utilisateur
        userMarker = L.circleMarker([lat, lon], {
            radius: 8,
            fillColor: "#007aff",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
        }).addTo(map).bindPopup("<b>Votre position</b>");

        // Cercle délimitant le rayon de 300 m
        radiusCircle = L.circle([lat, lon], {
            color: '#ffd166',
            fillColor: '#ffd166',
            fillOpacity: 0.1,
            radius: radiusMeters
        }).addTo(map);

        setTimeout(() => { map.invalidateSize(); }, 200);

        // Recherche des points d'intérêt dans le rayon de 300m
        fetchPOIsAround(lat, lon, radiusMeters);
    }

    async function fetchPOIsAround(lat, lon, radius) {
        try {
            // Requête Overpass API pour chercher les objets ayant un tag wikipedia
            const query = `
                [out:json][timeout:25];
                (
                  node["wikipedia"](around:${radius},${lat},${lon});
                  way["wikipedia"](around:${radius},${lat},${lon});
                  relation["wikipedia"](around:${radius},${lat},${lon});
                );
                out center;
            `;
            const overpassUrl = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
            const response = await fetch(overpassUrl);
            const data = await response.json();

            if (!data.elements || data.elements.length === 0) {
                return;
            }

            data.elements.forEach(el => {
                const itemLat = el.lat || (el.center && el.center.lat);
                const itemLon = el.lon || (el.center && el.center.lon);
                
                if (itemLat && itemLon && el.tags && el.tags.wikipedia) {
                    const wikiTag = el.tags.wikipedia; // Ex: "fr:Tour Eiffel" ou "Tour Eiffel"
                    let wikiTitle = wikiTag.includes(':') ? wikiTag.split(':')[1] : wikiTag;
                    const name = el.tags.name || wikiTitle;

                    // Créer un point rouge pour chaque élément wikipédia
                    const redMarker = L.circleMarker([itemLat, itemLon], {
                        radius: 7,
                        fillColor: "#ff4d4d",
                        color: "#ffffff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    });

                    redMarker.bindPopup(`<b>${name}</b><br><small>Cliquez pour écouter l'explication</small>`);
                    
                    redMarker.on('click', () => {
                        resetUI();
                        setStatus(`Chargement de : "${wikiTitle}"...`);
                        fetchFullArticleByTitle(wikiTitle);
                    });

                    poiLayerGroup.addLayer(redMarker);
                }
            });
        } catch (err) {
            console.error("Erreur chargement Overpass POIs:", err);
        }
    }

    function startGuideGPS() {
        resetUI();
        if (!navigator.geolocation) {
            setStatus("La géolocalisation n'est pas supportée par votre navigateur.");
            return;
        }

        setStatus("Recherche de votre position GPS...");
        document.getElementById('listen-btn').disabled = true;

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                initOrUpdateMap(lat, lon);
                setStatus(`Position trouvée. Analyse complète...`);
                fetchFullArticleByCoords(lat, lon);
            },
            (error) => {
                document.getElementById('listen-btn').disabled = false;
                setStatus("Erreur lors de la récupération GPS.");
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    function startGuideManual() {
        const inputField = document.getElementById('manual-place-input');
        const query = inputField.value.trim();
        if (!query) {
            setStatus("Veuillez saisir un nom de lieu.");
            return;
        }

        inputField.blur();
        resetUI();
        setStatus(`Recherche pour "${query}"...`);
        fetchFullArticleBySearch(query);
    }

    async function fetchFullArticleByCoords(lat, lon) {
        try {
            const wikiGeoUrl = `https://fr.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}|${lon}&gsradius=3000&gslimit=1&format=json&origin=*`;
            const res = await fetch(wikiGeoUrl);
            const data = await res.json();

            if (!data.query || !data.query.geosearch || data.query.geosearch.length === 0) {
                setStatus("Aucun lieu touristique trouvé à proximité.");
                document.getElementById('listen-btn').disabled = false;
                return;
            }

            const pageId = data.query.geosearch[0].pageid;
            const title = data.query.geosearch[0].title;
            loadFullArticleDetails(title, pageId);

        } catch (err) {
            console.error(err);
            setStatus("Erreur lors de la recherche géographique.");
            document.getElementById('listen-btn').disabled = false;
        }
    }

    async function fetchFullArticleBySearch(queryText) {
        try {
            const searchUrl = `https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(queryText)}&srlimit=1&format=json&origin=*`;
            const res = await fetch(searchUrl);
            const data = await res.json();

            if (!data.query || !data.query.search || data.query.search.length === 0) {
                setStatus(`Aucun résultat trouvé pour "${queryText}".`);
                document.getElementById('listen-btn').disabled = false;
                return;
            }

            const pageId = data.query.search[0].pageid;
            const title = data.query.search[0].title;
            loadFullArticleDetails(title, pageId);

        } catch (err) {
            console.error(err);
            setStatus("Erreur lors de la recherche textuelle.");
            document.getElementById('listen-btn').disabled = false;
        }
    }

    async function fetchFullArticleByTitle(title) {
        try {
            const searchUrl = `https://fr.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&format=json&origin=*`;
            const res = await fetch(searchUrl);
            const data = await res.json();
            
            if (data.query && data.query.pages) {
                const pageId = Object.keys(data.query.pages)[0];
                if (pageId !== "-1") {
                    loadFullArticleDetails(title, pageId);
                    return;
                }
            }
            fetchFullArticleBySearch(title);
        } catch (err) {
            fetchFullArticleBySearch(title);
        }
    }

    async function loadFullArticleDetails(title, pageId) {
        try {
            currentTitle = title;
            setStatus(`Chargement des photos et du guide pour "${currentTitle}"...`);
            document.getElementById('article-title').innerText = currentTitle;

            const parseUrl = `https://fr.wikipedia.org/w/api.php?action=parse&pageid=${pageId}&prop=text|images&format=json&origin=*`;
            const parsePromise = fetch(parseUrl).then(r => r.json());

            const voyUrl = `https://fr.wikivoyage.org/w/api.php?action=query&prop=extracts&exintro=0&explaintext=1&titles=${encodeURIComponent(title)}&format=json&origin=*`;
            const voyPromise = fetch(voyUrl).then(r => r.json()).catch(() => null);

            const commonsUrl = `https://fr.wikipedia.org/w/api.php?action=query&prop=images|pageimages&piprop=original&pageids=${pageId}&format=json&origin=*`;
            const commonsPromise = fetch(commonsUrl).then(r => r.json()).catch(() => null);

            const [parseData, voyData, commonsData] = await Promise.all([parsePromise, voyPromise, commonsPromise]);

            const wikiUrl = `https://fr.wikipedia.org/?curid=${pageId}`;
            const linkElement = document.getElementById('wikipedia-link');
            linkElement.href = wikiUrl;
            linkElement.innerText = `📖 Lire "${currentTitle}" sur Wikipédia`;
            document.getElementById('wikipedia-link-container').style.display = 'block';

            let imageUrls = [];

            if (commonsData && commonsData.query && commonsData.query.pages[pageId] && commonsData.query.pages[pageId].original) {
                imageUrls.push(commonsData.query.pages[pageId].original.source);
            }

            if (commonsData && commonsData.query && commonsData.query.pages[pageId] && commonsData.query.pages[pageId].images) {
                const imgList = commonsData.query.pages[pageId].images;
                for (let imgObj of imgList) {
                    let imgTitle = imgObj.title;
                    if (imgTitle && /\.(jpg|jpeg|png)$/i.test(imgTitle) && !imgTitle.toLowerCase().includes('logo') && !imgTitle.toLowerCase().includes('icon') && !imgTitle.toLowerCase().includes('map')) {
                        try {
                            let infoRes = await fetch(`https://fr.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(imgTitle)}&prop=imageinfo&iiprop=url&format=json&origin=*`);
                            let infoData = await infoRes.json();
                            let pages = infoData.query.pages;
                            for (let p in pages) {
                                if (pages[p].imageinfo && pages[p].imageinfo[0].url) {
                                    let directUrl = pages[p].imageinfo[0].url;
                                    if (!imageUrls.includes(directUrl)) {
                                        imageUrls.push(directUrl);
                                    }
                                }
                            }
                        } catch (e) {}
                    }
                    if (imageUrls.length >= 10) break;
                }
            }

            if (imageUrls.length === 0 && parseData && parseData.parse && parseData.parse.text) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = parseData.parse.text['*'];
                tempDiv.querySelectorAll('img').forEach(img => {
                    let src = img.getAttribute('src');
                    if (src) {
                        if (src.startsWith('//')) src = 'https:' + src;
                        if (!src.toLowerCase().includes('logo') && !src.toLowerCase().includes('icon') && !imageUrls.includes(src)) {
                            imageUrls.push(src);
                        }
                    }
                });
            }

            carouselImages = imageUrls.slice(0, 10);

            if (carouselImages.length > 0) {
                const track = document.getElementById('carousel-track');
                const indicators = document.getElementById('carousel-indicators');

                track.innerHTML = '';
                indicators.innerHTML = '';

                carouselImages.forEach((url, index) => {
                    const slide = document.createElement('div');
                    slide.className = 'carousel-slide';
                    slide.innerHTML = `<img src="${url}" alt="Illustration ${index + 1}">`;
                    track.appendChild(slide);

                    const dot = document.createElement('div');
                    dot.className = `indicator ${index === 0 ? 'active' : ''}`;
                    dot.onclick = () => goToSlide(index);
                    indicators.appendChild(dot);
                });

                currentSlideIndex = 0;
                document.getElementById('carousel-container').style.display = 'block';
                document.getElementById('sources-badge').innerText = "📚 Synthèse globale avec galerie photo interactive";
            } else {
                document.getElementById('sources-badge').innerText = "📚 Synthèse globale de l'article complet";
            }

            let rawParagraphs = [];

            if (voyData && voyData.query && voyData.query.pages) {
                const voyPages = voyData.query.pages;
                for (let id in voyPages) {
                    if (voyPages[id].extract && voyPages[id].extract.trim() !== "") {
                        rawParagraphs.push(voyPages[id].extract);
                    }
                }
            }

            if (parseData && parseData.parse && parseData.parse.text) {
                const htmlContent = parseData.parse.text['*'];
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlContent;

                const unwanted = tempDiv.querySelectorAll('.navbox, .infobox, .reference, .mw-editsection, table, sup');
                unwanted.forEach(el => el.remove());

                const paragraphs = tempDiv.querySelectorAll('p');
                paragraphs.forEach(p => {
                    let text = p.textContent.trim();
                    text = text.replace(/\[\d+\]/g, '');
                    if (text.length > 30) {
                        rawParagraphs.push(text);
                    }
                });
            }

            let seenSentences = new Set();
            combinedContent = [];

            for (let para of rawParagraphs) {
                let sentences = para.split(/(?<=[.!?])\s+/);
                let uniqueParaSentences = [];

                for (let sentence of sentences) {
                    let cleanSentence = sentence.trim();
                    let normalized = cleanSentence.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");

                    if (cleanSentence.length > 20 && !seenSentences.has(normalized)) {
                        seenSentences.add(normalized);
                        uniqueParaSentences.push(cleanSentence);
                    }
                }

                if (uniqueParaSentences.length > 0) {
                    combinedContent.push(uniqueParaSentences.join(" "));
                }
            }

            if (combinedContent.length === 0) {
                setStatus("Pas assez de contenu disponible pour ce lieu.");
                document.getElementById('listen-btn').disabled = false;
                return;
            }

            currentChunkIndex = 0;

            const durationFloat = parseFloat(document.getElementById('duration-select').value);
            const paragraphsCount = Math.max(2, Math.round(durationFloat * 3.3));

            const initialBatch = combinedContent.slice(currentChunkIndex, currentChunkIndex + paragraphsCount).join(" ");
            currentChunkIndex += paragraphsCount;

            const outputDiv = document.getElementById('output');
            outputDiv.innerText = initialBatch;
            outputDiv.style.display = 'block';

            if (currentChunkIndex < combinedContent.length) {
                document.getElementById('more-btn').style.display = 'block';
            }

            setStatus(`Lecture audio en cours (${durationFloat === 1 ? '1 minute' : durationFloat + ' min'})...`);
            speakText(initialBatch);

        } catch (err) {
            console.error(err);
            setStatus("Erreur lors de l'analyse complète de l'article.");
            document.getElementById('listen-btn').disabled = false;
        }
    }

    function goToSlide(index) {
        if (carouselImages.length === 0) return;
        currentSlideIndex = (index + carouselImages.length) % carouselImages.length;
        
        const track = document.getElementById('carousel-track');
        track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;

        const indicators = document.getElementById('carousel-indicators').children;
        for (let i = 0; i < indicators.length; i++) {
            indicators[i].classList.toggle('active', i === currentSlideIndex);
        }
    }

    function loadMoreDetails() {
        if (currentChunkIndex >= combinedContent.length) {
            setStatus("Vous avez écouté l'intégralité des chapitres disponibles.");
            document.getElementById('more-btn').style.display = 'none';
            return;
        }

        const nextBatch = combinedContent.slice(currentChunkIndex, currentChunkIndex + 6).join(" ");
        currentChunkIndex += 6;

        const outputDiv = document.getElementById('output');
        outputDiv.innerText += "\n\n" + nextBatch;
        outputDiv.scrollTop = outputDiv.scrollHeight;

        if (currentChunkIndex >= combinedContent.length) {
            document.getElementById('more-btn').style.display = 'none';
        }

        setStatus("Lecture de la suite des chapitres...");
        speakText(nextBatch);
    }

    function speakText(text) {
        if (synth.speaking || synth.pending) {
            synth.cancel();
        }

        currentSpokenText = text;

        setTimeout(() => {
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'fr-FR';
            
            const bestVoice = getBestFrenchVoice();
            if (bestVoice) {
                currentUtterance.voice = bestVoice;
            }

            const speedSelect = document.getElementById('speed-select');
            const speechRate = parseFloat(speedSelect.value);
            currentUtterance.rate = speechRate;

            const wordCount = text.split(/\s+/).length;
            const baseDurationSeconds = (wordCount / 150) * 60;
            speechDurationMs = (baseDurationSeconds / speechRate) * 1000;

            document.getElementById('total-time').innerText = formatTime(speechDurationMs / 1000);
            document.getElementById('current-time').innerText = "0:00";
            document.getElementById('progress-fill').style.width = "0%";
            document.getElementById('progress-container').style.display = 'block';

            speechStartTime = Date.now();
            pauseElapsedMs = 0;
            isPausedState = false;

            if (progressInterval) clearInterval(progressInterval);

            progressInterval = setInterval(() => {
                if (!synth.speaking && !synth.paused) return;

                if (!isPausedState) {
                    const elapsed = Date.now() - speechStartTime + pauseElapsedMs;
                    const progressRatio = Math.min(1, elapsed / speechDurationMs);
                    const progressPercent = progressRatio * 100;

                    document.getElementById('progress-fill').style.width = progressPercent + '%';
                    document.getElementById('current-time').innerText = formatTime(Math.min(speechDurationMs, elapsed) / 1000);

                    if (carouselImages.length > 0) {
                        const targetSlide = Math.min(
                            carouselImages.length - 1, 
                            Math.floor(progressRatio * carouselImages.length)
                        );
                        if (targetSlide !== currentSlideIndex) {
                            goToSlide(targetSlide);
                        }
                    }
                }
            }, 200);

            currentUtterance.onend = () => {
                clearInterval(progressInterval);
                document.getElementById('progress-fill').style.width = "100%";
                document.getElementById('current-time').innerText = formatTime(speechDurationMs / 1000);
                setStatus("Lecture terminée.");
                document.getElementById('listen-btn').disabled = false;
                document.getElementById('pause-btn').disabled = true;
                document.getElementById('stop-btn').disabled = true;
                document.getElementById('pause-btn').innerText = "Pause";
            };

            currentUtterance.onerror = (e) => {
                clearInterval(progressInterval);
                console.error("Erreur audio détectée :", e);
                setStatus("Erreur lors de la lecture audio.");
                document.getElementById('listen-btn').disabled = false;
            };

            synth.speak(currentUtterance);
            document.getElementById('pause-btn').disabled = false;
            document.getElementById('stop-btn').disabled = false;
            document.getElementById('pause-btn').innerText = "Pause";
        }, 100);
    }

    function changeSpeed() {
        if (synth.speaking && !synth.paused && currentUtterance) {
            const speed = parseFloat(document.getElementById('speed-select').value);
            currentUtterance.rate = speed;
        }
    }

    function togglePause() {
        if (!synth.speaking && !synth.paused) return;

        if (!isPausedState) {
            synth.cancel();
            isPausedState = true;
            pauseElapsedMs += Date.now() - speechStartTime;
            if (progressInterval) clearInterval(progressInterval);
            document.getElementById('pause-btn').innerText = "Reprendre";
            setStatus("Lecture en pause.");
        } else {
            isPausedState = false;
            document.getElementById('pause-btn').innerText = "Pause";
            setStatus("Lecture audio en cours...");

            currentUtterance = new SpeechSynthesisUtterance(currentSpokenText);
            currentUtterance.lang = 'fr-FR';
            
            const bestVoice = getBestFrenchVoice();
            if (bestVoice) {
                currentUtterance.voice = bestVoice;
            }

            const speedSelect = document.getElementById('speed-select');
            const speechRate = parseFloat(speedSelect.value);
            currentUtterance.rate = speechRate;

            speechStartTime = Date.now();

            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (!synth.speaking && !synth.paused) return;

                if (!isPausedState) {
                    const elapsed = Date.now() - speechStartTime + pauseElapsedMs;
                    const progressRatio = Math.min(1, elapsed / speechDurationMs);
                    const progressPercent = progressRatio * 100;

                    document.getElementById('progress-fill').style.width = progressPercent + '%';
                    document.getElementById('current-time').innerText = formatTime(Math.min(speechDurationMs, elapsed) / 1000);

                    if (carouselImages.length > 0) {
                        const targetSlide = Math.min(
                            carouselImages.length - 1, 
                            Math.floor(progressRatio * carouselImages.length)
                        );
                        if (targetSlide !== currentSlideIndex) {
                            goToSlide(targetSlide);
                        }
                    }
                }
            }, 200);

            currentUtterance.onend = () => {
                clearInterval(progressInterval);
                document.getElementById('progress-fill').style.width = "100%";
                document.getElementById('current-time').innerText = formatTime(speechDurationMs / 1000);
                setStatus("Lecture terminée.");
                document.getElementById('listen-btn').disabled = false;
                document.getElementById('pause-btn').disabled = true;
                document.getElementById('stop-btn').disabled = true;
                document.getElementById('pause-btn').innerText = "Pause";
            };

            currentUtterance.onerror = (e) => {
                clearInterval(progressInterval);
                setStatus("Erreur lors de la reprise audio.");
                document.getElementById('listen-btn').disabled = false;
            };

            synth.speak(currentUtterance);
        }
    }

    function stopAudio() {
        if (synth.speaking || synth.paused) {
            synth.cancel();
            if (progressInterval) clearInterval(progressInterval);
            setStatus("Lecture arrêtée.");
            document.getElementById('progress-container').style.display = 'none';
            document.getElementById('listen-btn').disabled = false;
            document.getElementById('pause-btn').disabled = true;
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('pause-btn').innerText = "Pause";
        }
    }
</script>
